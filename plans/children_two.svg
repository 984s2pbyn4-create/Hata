ель — предложение.</text><text x="95.00" y="853.00" font-size="15" fill="#71899B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Два входа в гардеробную подтверждены. Их ширину и точные координаты нужно проверить.</text></svg>