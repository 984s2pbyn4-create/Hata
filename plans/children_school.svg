xt x="832.00" y="494.00" font-size="15" fill="#DAE2EB" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">хранение.</text><line x1="835.00" y1="770.00" x2="985.00" y2="770.00" stroke="#E7ECF3" stroke-width="4" opacity="1"/><text x="910.00" y="796.00" font-size="15" fill="#A8B4C4" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">масштаб: 1 метр</text><text x="95.00" y="820.00" font-size="17" fill="#AAB7C7" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Геометрия — по обмерам + уточнение пользователя о второй двери; мебель — предложение.</text><text x="95.00" y="853.00" font-size="15" fill="#71899B" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Два входа в гардеробную подтверждены. Их ширину и точные координаты нужно проверить.</text></svg>